input: 
  stdin: true 

output: 
  mqtt:
    module: output-mqtt
    url: mqtt://test.mosquitto.org
    # see https://www.npmjs.com/package/mqtt#connect
    #connectOptions:
    #  username: nobody
    #  password: secret
    #  keepalive: 60
    #  wsOptions: 
    #    port: 9999
    #    host: localhost
    topic: sensor-data
    qos: 2
    retain: false
    debug: false
    # optional filter settings matching data field with regular expressions
    filter: 
      field: logSource
      match: .*
